name: Workflow checks

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile modules
        run: |
          python -m py_compile *.py tests/*.py tools/*.py
      - name: Verify frozen eval fixture manifest
        run: |
          python tools/check_goldset_manifest.py --manifest tests/fixtures/goldset_manifest.json
      - name: Run deterministic frozen eval gate
        run: |
          python eval_runner.py --goldset tests/fixtures/frozen_eval_set.csv --output data/output/evals/ci_frozen_eval_report.xlsx --enforce-gate --min-send-precision 90 --min-exact-agreement 90 --max-false-sends 0 --min-surface-correct-rate 80 --min-app-first-surface-correct-rate 90
      - name: Run privacy and sendability tests
        run: |
          python tests/test_privacy_and_sendability.py
      - name: Run guardrail tests
        run: |
          python tests/test_guardrails.py
      - name: Run run-history storage tests
        run: |
          python tests/test_run_history.py
      - name: Run campaign feedback tests
        run: |
          python tests/test_campaign_feedback.py
      - name: Run preflight and export mapping tests
        run: |
          python tests/test_preflight_and_exports.py
